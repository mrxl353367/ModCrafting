name: ModCrafting Fabric CI

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check plugin and browser types
        run: pnpm run typecheck
      - name: Run Fabric plugin regressions
        run: pnpm test
      - name: Build and validate standalone MCP
        run: pnpm run plugin:build
      - name: Validate manifest and entry
        run: pnpm run plugin:validate
      - name: Stage whitelist and reject private/development files
        run: pnpm run plugin:stage
      - name: Verify isolated MCP protocol and tool calls
        run: pnpm run plugin:smoke
      - name: Check offline Fabric-Bench verdicts and error codes
        run: pnpm run bench:fabric
      - name: Build portable Bench commands without running Minecraft
        run: pnpm run bench:build
